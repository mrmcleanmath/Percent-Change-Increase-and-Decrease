
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Percent Change: Increase and Decrease – Mr. McLean Math</title>
<style>
:root{
  --bg:#f5f6f9;--card:#fff;--text:#20242c;--muted:#667085;--border:#dfe3e8;
  --accent:#1976d2;--soft:#e9f2ff;--good:#2e7d32;--bad:#c62828;
  --shadow:0 8px 24px rgba(16,24,40,.07);--radius:18px;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}
.wrap{max-width:920px;margin:0 auto;padding:20px 14px 28px}
header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:clamp(25px,3vw,34px);line-height:1.1}
.subtitle{margin:5px 0 0;color:var(--muted);font-size:14px}
.tabs,.levels,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
button.active,button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.label{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}
.question{font-size:clamp(21px,2.5vw,29px);font-weight:850;line-height:1.35;text-align:center;margin:12px auto;max-width:760px}
.answer-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.answer-row input{width:min(280px,100%);font:inherit;font-size:18px;padding:11px 12px;border:1px solid var(--border);border-radius:12px;text-align:center}
.feedback{margin-top:14px;border:1px solid var(--border);border-radius:14px;padding:12px;background:#fafafa;min-height:74px}
.feedback-title{font-weight:900;font-size:18px}.feedback-title.good{color:var(--good)}.feedback-title.bad{color:var(--bad)}
.feedback-sub{margin-top:4px;color:var(--muted);font-size:13px;line-height:1.4}
.steps{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:13px;line-height:1.55;color:#475467}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{border:1px solid var(--border);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:850}
.worksheet{display:none}
.ws-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select{font:inherit;border:1px solid var(--border);border-radius:10px;background:#fff;padding:9px 10px}
.ws-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ws-item{border:1px solid var(--border);border-radius:14px;padding:12px;break-inside:avoid}
.ws-q{font-size:14px;font-weight:800;line-height:1.45}
.ws-answer{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:13px;font-weight:850;color:var(--good)}
.ws-answer.show{display:block}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
@media(max-width:720px){.ws-list{grid-template-columns:1fr}}
@media(max-width:520px){.answer-row{align-items:stretch}.answer-row input{width:100%}}
@media print{
  body{background:#fff}.wrap{max-width:none;padding:0}
  header,#practiceCard,.no-print,.footer{display:none!important}
  #worksheetCard{display:block!important;border:0;box-shadow:none;padding:0}
  .ws-list{grid-template-columns:1fr 1fr}.ws-answer{display:none!important}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Percent Change</h1>
    <p class="subtitle">Calculate percentage increase or decrease. Calculator recommended.</p>
  </div>
  <div class="tabs">
    <button id="practiceTab" class="active" type="button">Practice</button>
    <button id="worksheetTab" type="button">Worksheet</button>
  </div>
</header>

<section id="practiceCard" class="card">
  <div class="toolbar">
    <div>
      <div class="label">Difficulty</div>
      <div class="levels">
        <button class="level active" data-diff="easy" type="button">Foundation</button>
        <button class="level" data-diff="medium" type="button">Core</button>
        <button class="level" data-diff="hard" type="button">Challenge</button>
      </div>
    </div>
    <button id="newBtn" type="button">New Question</button>
  </div>

  <div id="question" class="question"></div>

  <div class="answer-row">
    <input id="answer" type="text" inputmode="decimal" autocomplete="off" placeholder="Percent change">
    <button id="checkBtn" class="primary" type="button">Check</button>
    <button id="nextBtn" type="button" disabled>Next</button>
    <button id="clearBtn" type="button">Clear</button>
  </div>

  <div class="feedback">
    <div id="feedbackTitle" class="feedback-title">Ready.</div>
    <div id="feedbackSub" class="feedback-sub">Enter the percentage change. You may include the % sign.</div>
    <div id="steps" class="steps"></div>
    <button id="stepsBtn" type="button" style="display:none;margin-top:10px">Show Steps</button>
  </div>

  <div class="stats">
    <div class="stat">Correct: <span id="correct">0</span></div>
    <div class="stat">Incorrect: <span id="incorrect">0</span></div>
  </div>
</section>

<section id="worksheetCard" class="card worksheet">
  <div class="ws-top">
    <div>
      <div style="font-size:19px;font-weight:900">Worksheet</div>
      <div id="wsMeta" class="subtitle">Generate percent-change questions.</div>
    </div>
    <div class="no-print row">
      <label style="font-size:13px;font-weight:800">Questions
        <select id="wsCount"><option>5</option><option selected>10</option><option>15</option></select>
      </label>
      <button id="generateWs" class="primary" type="button">Generate</button>
      <button id="revealAll" type="button" disabled>Reveal All</button>
      <button id="hideAll" type="button" disabled>Hide All</button>
      <button id="printBtn" type="button" disabled>Print</button>
    </div>
  </div>
  <div id="wsList" class="ws-list"></div>
</section>

<div class="footer">Created by Mr. McLean Math.</div>
</div>

<script>
(() => {
"use strict";
const $=id=>document.getElementById(id);
const randInt=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const roundTo=(v,p)=>Math.round((v+Number.EPSILON)*10**p)/10**p;
function formatNumber(v){
  const str=Number.isInteger(v)?String(v):Number(v).toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
  const [i,d]=str.split(".");
  return i.replace(/\B(?=(\d{3})+(?!\d))/g," ")+(d?"."+d:"");
}
function formatPercent(v,p){return Number(v).toFixed(p)+"%"}
function parseInput(s){
  if(s==null)return null;
  let t=String(s).trim().replace(/\s+/g,"").replace(/%/g,"").replace(",",".");
  if(!t||! /^[+]?\d+(?:\.\d+)?$/.test(t))return null;
  const n=Number(t);return Number.isFinite(n)?n:null;
}

const SETTINGS={
  easy:{originalMin:10,originalMax:120,changeMin:2,changeMax:60,dp:0,rounding:"Round to the nearest whole percent."},
  medium:{originalMin:40,originalMax:750,changeMin:7,changeMax:325,dp:1,rounding:"Round to the nearest tenth of a percent."},
  hard:{originalMin:125,originalMax:5000,changeMin:19,changeMax:4200,dp:2,rounding:"Round to the nearest hundredth of a percent."}
};

function generate(diff){
  const s=SETTINGS[diff];
  for(let tries=0;tries<300;tries++){
    const original=randInt(s.originalMin,s.originalMax);
    const direction=Math.random()<.5?"increase":"decrease";
    let maxChange=s.changeMax;
    if(direction==="decrease")maxChange=Math.min(maxChange,original-1);
    if(maxChange<s.changeMin)continue;
    const change=randInt(s.changeMin,maxChange);
    const newAmount=direction==="increase"?original+change:original-change;
    const exact=(change/original)*100;
    const rounded=roundTo(exact,s.dp);
    if(rounded<=0)continue;
    const neat=Math.abs(exact-Math.round(exact))<1e-9;
    if(neat&&Math.random()<.8)continue;
    return {diff,original,newAmount,change,direction,exact,answer:rounded,dp:s.dp,rounding:s.rounding};
  }
  const f={easy:[37,52],medium:[286,347],hard:[1375,984]}[diff];
  const direction=f[1]>f[0]?"increase":"decrease",change=Math.abs(f[1]-f[0]),exact=change/f[0]*100;
  return {diff,original:f[0],newAmount:f[1],change,direction,exact,answer:roundTo(exact,s.dp),dp:s.dp,rounding:s.rounding};
}
function questionText(q){
  return `An amount ${q.direction==="increase"?"increased":"decreased"} from ${formatNumber(q.original)} to ${formatNumber(q.newAmount)}. Calculate the percentage ${q.direction}. ${q.rounding}`;
}
function stepsFor(q){
  const diff=Math.abs(q.newAmount-q.original);
  const fraction=diff/q.original;
  return [
    `Original amount: ${formatNumber(q.original)}`,
    `New amount: ${formatNumber(q.newAmount)}`,
    `Difference: ${formatNumber(diff)}`,
    `Percentage change = difference ÷ original × 100`,
    `${formatNumber(diff)} ÷ ${formatNumber(q.original)} × 100 ≈ ${q.exact.toFixed(6)}%`,
    `${q.rounding} Answer: ${formatPercent(q.answer,q.dp)}`
  ];
}

let difficulty="easy",current=null,evaluated=false,correct=0,incorrect=0;

function feedback(kind,title,sub){
  const t=$("feedbackTitle");t.className="feedback-title"+(kind?" "+kind:"");t.textContent=title;$("feedbackSub").textContent=sub||"";
}
function hideSteps(){
  $("steps").style.display="none";$("steps").textContent="";$("stepsBtn").style.display="none";$("stepsBtn").textContent="Show Steps";
}
function newQuestion(){
  current=generate(difficulty);evaluated=false;
  $("question").textContent=questionText(current);
  $("answer").value="";$("answer").disabled=false;$("checkBtn").disabled=false;$("nextBtn").disabled=true;
  hideSteps();feedback("","Ready.","Enter the percentage change. You may include the % sign.");$("answer").focus();
}
function check(){
  if(!current||evaluated)return;
  const val=parseInput($("answer").value);
  if(val===null){feedback("","Enter an answer.","Type a valid number. Blank or invalid answers are not counted.");return;}
  evaluated=true;$("answer").disabled=true;$("checkBtn").disabled=true;$("nextBtn").disabled=false;
  $("steps").innerHTML=stepsFor(current).join("<br>");$("stepsBtn").style.display="inline-block";
  const ok=Math.abs(val-current.answer)<1e-9;
  if(ok){correct++;$("correct").textContent=correct;feedback("good","Correct!","Press Enter or Next for a new question.");}
  else{incorrect++;$("incorrect").textContent=incorrect;feedback("bad","Incorrect.",`Correct answer: ${formatPercent(current.answer,current.dp)}`);}
}
function clearAnswer(){if(evaluated)return;$("answer").value="";$("answer").focus()}

document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));b.classList.add("active");difficulty=b.dataset.diff;newQuestion();
}));
$("newBtn").addEventListener("click",newQuestion);$("checkBtn").addEventListener("click",check);$("nextBtn").addEventListener("click",newQuestion);$("clearBtn").addEventListener("click",clearAnswer);
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();evaluated?newQuestion():check()}else if(e.key==="Escape"){e.preventDefault();clearAnswer()}});
$("stepsBtn").addEventListener("click",()=>{const show=$("steps").style.display!=="block";$("steps").style.display=show?"block":"none";$("stepsBtn").textContent=show?"Hide Steps":"Show Steps"});

function showPractice(){$("practiceTab").classList.add("active");$("worksheetTab").classList.remove("active");$("practiceCard").style.display="block";$("worksheetCard").style.display="none"}
function showWorksheet(){$("worksheetTab").classList.add("active");$("practiceTab").classList.remove("active");$("practiceCard").style.display="none";$("worksheetCard").style.display="block"}
$("practiceTab").addEventListener("click",showPractice);$("worksheetTab").addEventListener("click",showWorksheet);

function generateWorksheet(){
  const n=Number($("wsCount").value),list=$("wsList");list.innerHTML="";
  const labels={easy:"Foundation",medium:"Core",hard:"Challenge"};
  for(let i=0;i<n;i++){
    const q=generate(difficulty),box=document.createElement("div");box.className="ws-item";
    const qt=document.createElement("div");qt.className="ws-q";qt.textContent=`${i+1}. ${questionText(q)}`;
    const ans=document.createElement("div");ans.className="ws-answer";ans.textContent=`Answer: ${formatPercent(q.answer,q.dp)}`;
    const btn=document.createElement("button");btn.type="button";btn.className="no-print";btn.style.marginTop="8px";btn.textContent="Reveal";
    btn.addEventListener("click",()=>{ans.classList.toggle("show");btn.textContent=ans.classList.contains("show")?"Hide":"Reveal"});
    box.append(qt,ans,btn);list.appendChild(box);
  }
  $("wsMeta").textContent=`${labels[difficulty]} • ${n} questions`;
  $("revealAll").disabled=$("hideAll").disabled=$("printBtn").disabled=false;
}
$("generateWs").addEventListener("click",generateWorksheet);
$("revealAll").addEventListener("click",()=>document.querySelectorAll(".ws-answer").forEach(x=>x.classList.add("show")));
$("hideAll").addEventListener("click",()=>document.querySelectorAll(".ws-answer").forEach(x=>x.classList.remove("show")));
$("printBtn").addEventListener("click",()=>window.print());

window.__MMM_TEST__={generate,SETTINGS};
newQuestion();
})();
</script>
</body>
</html>
